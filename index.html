<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System Simulator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* UI Overlay basic styles */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: white;
    }

    .pointer-events-auto {
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <canvas id="app"></canvas>
  <div id="ui-layer">
    <!-- HUD will be injected here -->
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
